<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeCRM Broadcast - Painel de Controle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-50">
    <!-- Sidebar -->
    <div class="fixed inset-y-0 left-0 w-64 bg-gradient-to-b from-purple-700 to-indigo-800 text-white shadow-xl z-50">
        <div class="flex flex-col h-full">
            <!-- Logo -->
            <div class="flex items-center justify-center h-20 border-b border-white/10">
                <i class="fas fa-broadcast-tower text-3xl mr-3"></i>
                <h1 class="text-xl font-bold">BeeCRM Broadcast</h1>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 overflow-y-auto py-6">
                <a href="#" class="nav-link active" data-page="campaigns">
                    <i class="fas fa-bullhorn"></i>
                    <span>Campanhas</span>
                </a>
                <a href="#" class="nav-link" data-page="create">
                    <i class="fas fa-plus-circle"></i>
                    <span>Nova Campanha</span>
                </a>
                <a href="#" class="nav-link" data-page="queue">
                    <i class="fas fa-layer-group"></i>
                    <span>Filas</span>
                </a>
                <a href="#" class="nav-link" data-page="stats">
                    <i class="fas fa-chart-line"></i>
                    <span>Estatísticas</span>
                </a>
            </nav>

            <!-- Footer -->
            <div class="p-4 border-t border-white/10">
                <div class="text-xs text-white/60">
                    <p>v1.0.0</p>
                    <p>BeeLabs © 2025</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="ml-64 p-8">
        <!-- Header -->
        <div class="mb-8">
            <h2 id="page-title" class="text-3xl font-bold text-gray-800">Campanhas de Broadcast</h2>
            <p id="page-subtitle" class="text-gray-600 mt-1">Gerencie suas campanhas de WhatsApp</p>
        </div>

        <!-- Content Area -->
        <div id="content-area"></div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 flex items-center space-x-3">
            <div class="spinner"></div>
            <span class="text-gray-700 font-medium">Carregando...</span>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/campaigns.js"></script>
    <script src="/js/create.js"></script>
    <script src="/js/queue.js"></script>
    <script src="/js/stats.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
