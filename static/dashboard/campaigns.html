<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campanhas - BeeCRM Broadcast</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1>🐝 BeeCRM Broadcast</h1>
            <div class="nav-actions">
                <span id="userInfo" class="user-info"></span>
                <button onclick="logout()" class="btn-secondary">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Campanhas</h2>
            <div class="header-actions">
                <button onclick="refreshCampaigns()" class="btn-secondary">🔄 Atualizar</button>
            </div>
        </div>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Buscar por nome ou ID..." class="search-input">
            <select id="statusFilter" class="filter-select">
                <option value="">Todos os Status</option>
                <option value="DRAFT">Rascunho</option>
                <option value="SCHEDULED">Agendada</option>
                <option value="PROCESSING">Em Processamento</option>
                <option value="COMPLETED">Concluída</option>
                <option value="PAUSED">Pausada</option>
                <option value="CANCELED">Cancelada</option>
                <option value="FAILED">Falha</option>
            </select>
        </div>

        <div id="campaignsContainer" class="campaigns-grid"></div>
        <div id="loadingSpinner" class="loading-spinner">Carregando...</div>
        <div id="errorContainer" class="error-container"></div>
        
        <div class="pagination">
            <button id="prevPage" onclick="previousPage()" class="btn-secondary">← Anterior</button>
            <span id="pageInfo" class="page-info"></span>
            <button id="nextPage" onclick="nextPage()" class="btn-secondary">Próxima →</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/campaigns.js"></script>
</body>
</html>
